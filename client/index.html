<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0000" />
    <title>NEBULA</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #0a0000; color: #ffcccc; font-family: 'Courier New', monospace; min-height: 100vh; }
      button, input { font: inherit; }
      button { transition: filter 0.2s ease, opacity 0.2s ease; }
      button:hover:not(:disabled) { filter: brightness(1.25); }
      button:disabled { cursor: not-allowed; opacity: 0.45; }
      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-track { background: #1a0000; }
      ::-webkit-scrollbar-thumb { background: #ff0000; border-radius: 10px; }
      .app-shell { height: 100vh; display: flex; flex-direction: column; background: #0a0000; }
      .header { padding: 1rem 2rem; border-bottom: 2px solid #ff0000; background: rgba(10, 0, 0, 0.95); display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-shrink: 0; }
      .header h1 { display: inline; color: #ff0000; font-size: 1.3rem; text-shadow: 0 0 20px #ff0000; }
      .header .user { color: #ff6666; font-size: 0.6rem; border: 1px solid #660000; padding: 0.2rem 0.6rem; border-radius: 2px; margin-left: 0.5rem; }
      .status-label { color: #883333; font-size: 0.5rem; letter-spacing: 2px; margin-left: 0.5rem; }
      .logout { background: transparent; color: #ff3333; border: 1px solid #ff000040; border-radius: 0.3rem; padding: 0.3rem 0.8rem; cursor: pointer; }
      .messages { flex: 1; overflow-y: auto; padding: 1.5rem; display: flex; flex-direction: column; gap: 0.8rem; }
      .message { max-width: 85%; padding: 0.8rem 1.2rem; border-radius: 0.5rem; font-size: 0.85rem; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
      .message.user { align-self: flex-end; background: rgba(255, 0, 0, 0.1); border: 1px solid #ff000030; color: #ff6666; }
      .message.ai { align-self: flex-start; background: rgba(20, 0, 0, 0.7); border: 1px solid #330000; color: #ffcccc; }
      .input-area { padding: 0.8rem 2rem; border-top: 2px solid #ff0000; background: rgba(10, 0, 0, 0.95); display: flex; gap: 0.5rem; flex-shrink: 0; }
      .input-area input { flex: 1; padding: 0.8rem; background: #0a0000; color: #ff3333; border: 1px solid #ff000040; border-radius: 0.5rem; outline: none; font-size: 0.85rem; }
      .input-area input:focus, .login-box input:focus { border-color: #ff0000; box-shadow: 0 0 15px #ff000030; }
      .input-area button, .login-box button { padding: 0.8rem 2rem; background: linear-gradient(135deg, #ff0000, #660000); color: #000; border: none; border-radius: 0.5rem; font-weight: bold; cursor: pointer; }
      .login { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0a0000; padding: 1rem; }
      .login-box { background: rgba(10, 0, 0, 0.95); padding: 3rem 2rem; border-radius: 1rem; border: 2px solid #ff0000; box-shadow: 0 0 80px rgba(255, 0, 0, 0.2); max-width: 480px; width: 100%; text-align: center; }
      .login-box h1 { color: #ff0000; font-size: 3.5rem; text-shadow: 0 0 40px #ff0000; letter-spacing: 10px; margin-bottom: 2rem; }
      .login-box input { width: 100%; padding: 0.9rem; background: #0a0000; color: #ff3333; border: 1px solid #ff000060; border-radius: 0.5rem; font-size: 1rem; outline: none; margin-bottom: 1.5rem; text-align: center; }
      .login-box button { width: 100%; font-size: 1.1rem; }
      .loading { min-height: 100vh; background: #0a0000; display: flex; align-items: center; justify-content: center; }
      .loading h2 { color: #ff0000; font-size: 1.2rem; letter-spacing: 4px; }
      .thinking { color: #ff0000; font-size: 0.7rem; }
      .error { color: #ff7777; font-size: 0.75rem; margin-top: 0.8rem; line-height: 1.4; }
      .chat-error { align-self: center; max-width: 90%; }
      @media (max-width: 600px) {
        .header { padding: 0.8rem 1rem; }
        .messages { padding: 1rem; }
        .input-area { padding: 0.7rem 1rem; }
        .input-area button { padding: 0.8rem 1rem; }
        .status-label { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
